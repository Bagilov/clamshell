[tool.ruff]
target-version = "py39"
line-length = 88
# Build output contains copies of the sources; never lint those.
exclude = ["build", "ui/.build", "ui/build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PL", "RUF", "EXE"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["EXE001"]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["build", "ui", ".venv"]
